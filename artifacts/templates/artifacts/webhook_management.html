{% extends "artifacts/base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <!-- Page Header -->
    <div class="mb-8">
        <div class="flex items-center justify-between gap-4 mb-4">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-gradient-to-br from-green-500 to-teal-600 rounded-2xl flex items-center justify-center shadow-lg">
                    <i class="fas fa-webhook text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-bold text-slate-800">웹훅 관리</h1>
                    <p class="text-slate-500">Discord 웹훅 설정 및 관리</p>
                </div>
            </div>
            
            <a href="{% url 'artifacts:admin_manage' %}" 
               class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition-all flex items-center gap-2">
                <i class="fas fa-arrow-left"></i>
                관리자 페이지
            </a>
        </div>
    </div>

    <!-- Webhook List Section -->
    <div class="bg-white/70 backdrop-blur-sm rounded-2xl shadow-xl border border-slate-200/50 overflow-hidden"
         x-data="webhookManager()">
        <div class="bg-gradient-to-r from-green-500 to-teal-600 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-list text-white text-xl"></i>
                <div>
                    <h2 class="text-xl font-bold text-white">등록된 웹훅</h2>
                    <p class="text-green-100 text-sm">최대 5개까지 등록 가능</p>
                </div>
            </div>
            <button @click="openCreateModal()" 
                    :disabled="webhooks.length >= 5"
                    :class="webhooks.length >= 5 ? 'opacity-50 cursor-not-allowed' : ''"
                    class="px-4 py-2 bg-white hover:bg-slate-50 text-green-600 rounded-lg text-sm font-medium transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                <i class="fas fa-plus"></i>
                <span x-text="webhooks.length >= 5 ? '최대 개수 도달 (5/5)' : '새 웹훅 추가'"></span>
            </button>
        </div>
        
        <div class="p-6">
            <!-- Loading State -->
            <div x-show="loading" class="text-center py-8">
                <i class="fas fa-spinner fa-spin text-4xl text-green-500"></i>
                <p class="mt-2 text-slate-600">웹훅을 로드하는 중...</p>
            </div>

            <!-- Empty State -->
            <div x-show="!loading && webhooks.length === 0" class="text-center py-12">
                <i class="fas fa-inbox text-6xl text-slate-300 mb-4"></i>
                <p class="text-slate-500 text-lg">등록된 웹훅이 없습니다.</p>
                <button @click="openCreateModal()" 
                        class="mt-4 px-4 py-2 bg-gradient-to-r from-green-500 to-teal-600 hover:from-green-600 hover:to-teal-700 text-white rounded-lg font-medium transition-all">
                    첫 번째 웹훅 추가하기
                </button>
            </div>

            <!-- Webhook Table -->
            <div x-show="!loading && webhooks.length > 0" class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">이름</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">웹훅 URL</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">상태</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">알림 이벤트</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">작업</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-slate-200">
                        <template x-for="webhook in webhooks" :key="webhook.id">
                            <tr class="hover:bg-green-50/50 transition-colors">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex items-center gap-2">
                                        <i class="fas fa-webhook text-slate-400"></i>
                                        <span class="text-sm font-medium text-slate-900" x-text="webhook.name"></span>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <code class="text-xs text-slate-600 bg-slate-100 px-2 py-1 rounded" x-text="webhook.masked_url"></code>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span :class="webhook.is_active ? 'bg-green-100 text-green-800' : 'bg-slate-100 text-slate-800'" 
                                          class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full">
                                        <span x-text="webhook.is_active ? '활성화' : '비활성화'"></span>
                                    </span>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex flex-wrap gap-1">
                                        <template x-for="event in webhook.enabled_events" :key="event">
                                            <span class="px-2 py-1 text-xs font-medium bg-blue-100 text-blue-800 rounded" x-text="event"></span>
                                        </template>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                    <button @click="testWebhook(webhook.id)" 
                                            class="text-blue-600 hover:text-blue-900 mr-3">
                                        <i class="fas fa-paper-plane"></i> 테스트
                                    </button>
                                    <button @click="openEditModal(webhook)" 
                                            class="text-indigo-600 hover:text-indigo-900 mr-3">
                                        <i class="fas fa-edit"></i> 수정
                                    </button>
                                    <button @click="deleteWebhook(webhook.id, webhook.name)" 
                                            class="text-red-600 hover:text-red-900">
                                        <i class="fas fa-trash"></i> 삭제
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Webhook Modal -->
        <template x-teleport="body">
            <div x-show="showModal" 
                 x-cloak
                 @keydown.escape.window="showModal = false"
                 class="fixed inset-0 z-[9999] overflow-y-auto" 
                 style="display: none;">
                <div class="flex items-center justify-center min-h-screen p-4">
                    <div @click="showModal = false" class="fixed inset-0 bg-black/50 backdrop-blur-sm transition-opacity"></div>
                    
                    <div class="relative bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 my-8 transform transition-all">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-bold text-slate-800" x-text="isEdit ? '웹훅 수정' : '새 웹훅 추가'"></h3>
                            <button @click="showModal = false" class="text-slate-400 hover:text-slate-600">
                                <i class="fas fa-times text-xl"></i>
                            </button>
                        </div>
                        
                        <form @submit.prevent="saveWebhook()">
                            <div class="space-y-4">
                                <!-- Name -->
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">
                                        <i class="fas fa-tag mr-1"></i> 웹훅 이름
                                    </label>
                                    <input type="text" 
                                           x-model="formData.name" 
                                           required
                                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                                           placeholder="예: 운영팀 알림">
                                </div>
                                
                                <!-- Webhook URL -->
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">
                                        <i class="fas fa-link mr-1"></i> Discord 웹훅 URL
                                    </label>
                                    <input type="url" 
                                           x-model="formData.webhook_url" 
                                           required
                                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 font-mono text-sm"
                                           placeholder="https://discord.com/api/webhooks/...">
                                    <p class="mt-1 text-xs text-slate-500">Discord 서버 설정 > 연동 > 웹훅에서 생성할 수 있습니다.</p>
                                </div>
                                
                                <!-- Active Status -->
                                <div class="flex items-center">
                                    <input type="checkbox" 
                                           id="is_active"
                                           x-model="formData.is_active"
                                           class="h-4 w-4 text-green-600 focus:ring-green-500 border-slate-300 rounded">
                                    <label for="is_active" class="ml-2 block text-sm text-slate-900">
                                        웹훅 활성화
                                    </label>
                                </div>
                                
                                <!-- Event Filters -->
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-3">
                                        <i class="fas fa-filter mr-1"></i> 알림받을 이벤트 선택
                                    </label>
                                    <div class="space-y-2 bg-slate-50 p-4 rounded-lg">
                                        <div class="flex items-center">
                                            <input type="checkbox" 
                                                   id="event_file_upload"
                                                   x-model="formData.event_file_upload"
                                                   class="h-4 w-4 text-green-600 focus:ring-green-500 border-slate-300 rounded">
                                            <label for="event_file_upload" class="ml-2 block text-sm text-slate-900">
                                                📤 파일 업로드
                                            </label>
                                        </div>
                                        <div class="flex items-center">
                                            <input type="checkbox" 
                                                   id="event_file_delete"
                                                   x-model="formData.event_file_delete"
                                                   class="h-4 w-4 text-green-600 focus:ring-green-500 border-slate-300 rounded">
                                            <label for="event_file_delete" class="ml-2 block text-sm text-slate-900">
                                                🗑️ 파일 삭제
                                            </label>
                                        </div>
                                        <div class="flex items-center">
                                            <input type="checkbox" 
                                                   id="event_download_single"
                                                   x-model="formData.event_download_single"
                                                   class="h-4 w-4 text-green-600 focus:ring-green-500 border-slate-300 rounded">
                                            <label for="event_download_single" class="ml-2 block text-sm text-slate-900">
                                                📥 개별 다운로드 <span class="text-xs text-slate-500">(알림이 많을 수 있음)</span>
                                            </label>
                                        </div>
                                        <div class="flex items-center">
                                            <input type="checkbox" 
                                                   id="event_download_bulk"
                                                   x-model="formData.event_download_bulk"
                                                   class="h-4 w-4 text-green-600 focus:ring-green-500 border-slate-300 rounded">
                                            <label for="event_download_bulk" class="ml-2 block text-sm text-slate-900">
                                                📦 일괄 다운로드
                                            </label>
                                        </div>
                                        <div class="flex items-center">
                                            <input type="checkbox" 
                                                   id="event_admin_activity"
                                                   x-model="formData.event_admin_activity"
                                                   class="h-4 w-4 text-green-600 focus:ring-green-500 border-slate-300 rounded">
                                            <label for="event_admin_activity" class="ml-2 block text-sm text-slate-900">
                                                ⚙️ 관리자 활동 (제품/카테고리 관리 등)
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex gap-3 mt-6">
                                <button type="submit"
                                        :disabled="saving"
                                        class="flex-1 px-4 py-2 bg-gradient-to-r from-green-500 to-teal-600 hover:from-green-600 hover:to-teal-700 text-white rounded-lg font-medium transition-all shadow-md hover:shadow-lg disabled:opacity-50">
                                    <i class="fas fa-save mr-1"></i>
                                    <span x-text="saving ? '저장 중...' : '저장'"></span>
                                </button>
                                <button type="button" 
                                        @click="showModal = false"
                                        class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition-colors">
                                    취소
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>

<style>
    [x-cloak] { display: none !important; }
</style>
{% endblock %}

{% block extra_js %}
<script>
function webhookManager() {
    return {
        webhooks: [],
        loading: true,
        showModal: false,
        isEdit: false,
        saving: false,
        formData: {
            id: null,
            name: '',
            webhook_url: '',
            is_active: true,
            event_file_upload: true,
            event_file_delete: true,
            event_download_single: false,
            event_download_bulk: true,
            event_admin_activity: true
        },
        
        init() {
            this.loadWebhooks();
        },
        
        async loadWebhooks() {
            this.loading = true;
            try {
                const response = await fetch('/manage/api/webhooks/');
                const result = await response.json();
                
                if (result.success) {
                    this.webhooks = result.webhooks;
                } else {
                    showNotification(result.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('웹훅 로드에 실패했습니다.', 'error');
            } finally {
                this.loading = false;
            }
        },
        
        openCreateModal() {
            this.isEdit = false;
            this.formData = {
                id: null,
                name: '',
                webhook_url: '',
                is_active: true,
                event_file_upload: true,
                event_file_delete: true,
                event_download_single: false,
                event_download_bulk: true,
                event_admin_activity: true
            };
            this.showModal = true;
        },
        
        openEditModal(webhook) {
            this.isEdit = true;
            this.formData = {
                id: webhook.id,
                name: webhook.name,
                webhook_url: webhook.webhook_url,
                is_active: webhook.is_active,
                event_file_upload: webhook.event_file_upload,
                event_file_delete: webhook.event_file_delete,
                event_download_single: webhook.event_download_single,
                event_download_bulk: webhook.event_download_bulk,
                event_admin_activity: webhook.event_admin_activity
            };
            this.showModal = true;
        },
        
        async saveWebhook() {
            this.saving = true;
            const url = this.isEdit 
                ? `/manage/webhook/${this.formData.id}/update/`
                : '/manage/webhook/create/';
            
            const formData = new FormData();
            formData.append('name', this.formData.name);
            formData.append('webhook_url', this.formData.webhook_url);
            formData.append('is_active', this.formData.is_active);
            formData.append('event_file_upload', this.formData.event_file_upload);
            formData.append('event_file_delete', this.formData.event_file_delete);
            formData.append('event_download_single', this.formData.event_download_single);
            formData.append('event_download_bulk', this.formData.event_download_bulk);
            formData.append('event_admin_activity', this.formData.event_admin_activity);
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData,
                    headers: {'X-CSRFToken': getCookie('csrftoken')}
                });
                const result = await response.json();
                
                if (result.success) {
                    showNotification(result.message, 'success');
                    this.showModal = false;
                    await this.loadWebhooks();
                } else {
                    showNotification(result.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('저장에 실패했습니다.', 'error');
            } finally {
                this.saving = false;
            }
        },
        
        async deleteWebhook(id, name) {
            if (!confirm(`"${name}" 웹훅을 삭제하시겠습니까?`)) return;
            
            try {
                const response = await fetch(`/manage/webhook/${id}/delete/`, {
                    method: 'POST',
                    headers: {'X-CSRFToken': getCookie('csrftoken')}
                });
                const result = await response.json();
                
                if (result.success) {
                    showNotification(result.message, 'success');
                    await this.loadWebhooks();
                } else {
                    showNotification(result.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('삭제에 실패했습니다.', 'error');
            }
        },
        
        async testWebhook(id) {
            try {
                const response = await fetch(`/manage/webhook/${id}/test/`, {
                    method: 'POST',
                    headers: {'X-CSRFToken': getCookie('csrftoken')}
                });
                const result = await response.json();
                
                if (result.success) {
                    showNotification(result.message, 'success');
                } else {
                    showNotification(result.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('테스트 전송에 실패했습니다.', 'error');
            }
        }
    };
}

function showNotification(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `fixed top-4 right-4 px-6 py-3 rounded-xl shadow-lg z-[10000] flex items-center gap-2 ${
        type === 'success' ? 'bg-green-500' : 
        type === 'error' ? 'bg-red-500' : 'bg-blue-500'
    } text-white font-medium animate-fade-in`;
    toast.innerHTML = `
        <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
        ${message}
    `;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
